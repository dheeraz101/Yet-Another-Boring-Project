name: Verify Projects Database & Website

on:
  push:
    branches: [ main ]
    paths:
      - 'projects.json'
      - '*.html'
      - '.github/workflows/verify-projects.yml'
      - '.github/scripts/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'projects.json'
      - '*.html'

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run Project JSON Validation
      run: node .github/scripts/verify-projects.js

    - name: Run HTML & Asset Reference Validation
      run: node .github/scripts/verify-html.js
