# netlify.toml
# Optimizes Netlify build credits by skipping builds unless core website files change.

[build]
  publish = "."
  # Only trigger a build/deploy if index.html, logo.png, favicon.ico, or netlify.toml are updated.
  # If any other files (like projects.json, workflows, readmes) are modified, the build will exit with 0
  # and Netlify will cancel the deployment build, saving credits.
  ignore = "git diff --quiet HEAD^ HEAD -- index.html logo.png favicon.ico netlify.toml"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' https://fonts.gstatic.com https://cdn.jsdelivr.net; img-src 'self' data: https://raw.githubusercontent.com https://cdn.jsdelivr.net; connect-src 'self' https://raw.githubusercontent.com;"
